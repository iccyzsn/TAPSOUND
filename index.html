<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FF5C00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DABEH POGI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FF5C00;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .text {
      color: #000000;
      font-size: clamp(2rem, 11vw, 7rem);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none; /* Let the body handle all clicks */
    }
  </style>
</head>
<body>
  <div class="text">DABEH POGI</div>
  <audio id="audio" src="37263.mp3" preload="auto" loop playsinline></audio>

  <script>
    (() => {
      'use strict';

      const audio = document.getElementById('audio');
      
      // Tweakables
      const BOOST = 3.0; // Makes the volume louder without clipping
      
      let ctx = null;
      let graphReady = false;

      audio.volume = 1;

      // Loudness boost (Web Audio API)
      function buildGraph() {
        if (graphReady) return;
        graphReady = true;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try {
          ctx = new AC();
          const src = ctx.createMediaElementSource(audio);
          const gain = ctx.createGain();
          gain.gain.value = BOOST;

          const comp = ctx.createDynamicsCompressor();
          comp.threshold.value = -14;
          comp.knee.value = 8;
          comp.ratio.value = 20;
          comp.attack.value = 0.002;
          comp.release.value = 0.2;

          src.connect(gain).connect(comp).connect(ctx.destination);
        } catch (err) {
          console.warn('Web Audio unavailable, using element volume only', err);
          ctx = null;
        }
      }

      function playSound() {
        // Resume audio context immediately (needed for some browsers)
        if (ctx && ctx.state !== 'running') {
          ctx.resume().catch(() => {});
        }
        
        // Restart from the beginning on every tap
        try { audio.currentTime = 0; } catch(_){}
        
        // Play (no pause logic anywhere)
        audio.play().catch(err => {
          console.warn('Playback blocked:', err && err.name);
        });
      }

      // Setup Media Session (play only, no pause)
      if ('mediaSession' in navigator) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'DABEH POGI', artist: 'DABEH POGI', album: 'DABEH POGI'
          });
          navigator.mediaSession.setActionHandler('play', playSound);
          // Remove any pause handlers so it cannot be paused via media controls
          navigator.mediaSession.setActionHandler('pause', null);
          navigator.mediaSession.setActionHandler('stop', null);
        } catch(_){}
      }

      // Trigger sound instantly on ANY pointer down or key press
      function handleInteraction(e) {
        if (e.type === 'pointerdown' && e.button !== undefined && e.button !== 0) return;
        if (e.type === 'keydown' && e.key !== ' ' && e.key !== 'Enter') return;
        playSound();
      }

      document.addEventListener('pointerdown', handleInteraction, { passive: true });
      document.addEventListener('keydown', handleInteraction, { passive: true });

      // Boot up
      buildGraph();
      try { audio.load(); } catch(_){}
      
      // Attempt autoplay on load (usually blocked until first gesture)
      playSound();

      // Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(console.error);
        });
      }
    })();
  </script>
</body>
</html>
