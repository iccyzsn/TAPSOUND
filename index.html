<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <title>TapSound</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif}
    body{display:grid;place-items:center;overflow:hidden}
    button{
      width:160px;height:160px;border:0;border-radius:50%;
      background:#fff;color:#111;font-size:24px;font-weight:700;
      box-shadow:0 14px 40px #0008;cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    button:active{transform:scale(.94)}
    button.playing{background:#ddd}
    .hint{position:fixed;bottom:28px;left:0;right:0;text-align:center;font-size:13px;color:#aaa}
  </style>
</head>
<body>
  <button id="btn" aria-label="Play sound">▶</button>
  <div class="hint">Tap to play • loops continuously</div>

  <audio id="audio" src="37263.mp3" preload="auto" loop playsinline></audio>

  <script>
    const audio = document.getElementById('audio');
    const btn = document.getElementById('btn');

    audio.volume = 1;

    function updateUI(){
      const playing = !audio.paused;
      btn.textContent = playing ? '❚❚' : '▶';
      btn.classList.toggle('playing', playing);
    }

    function setupMediaSession(){
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'TapSound',
        artist: 'TapSound',
        album: 'TapSound'
      });
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    }

    btn.addEventListener('click', async () => {
      try {
        if (audio.paused) {
          audio.volume = 1;
          await audio.play();
        } else {
          audio.pause();
        }
        updateUI();
        setupMediaSession();
      } catch (e) {
        console.error(e);
      }
    });

    audio.addEventListener('play', updateUI);
    audio.addEventListener('pause', updateUI);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
