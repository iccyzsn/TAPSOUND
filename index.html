<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FF5C00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DABEH POGI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FF5C00;
    }
    /* Make the button cover the entire screen */
    #playBtn {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 0;
      background-color: #FF5C00;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      outline: none;
      -webkit-appearance: none; /* Removes default iOS button styling */
    }
    /* The text inside the button */
    #playBtn span {
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(2rem, 12vw, 8rem);
      font-weight: 800;
      font-style: italic;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none; /* Ensures the click goes to the button, not the text */
    }
  </style>
</head>
<body>
  <!-- Using a real <button> is crucial for iOS Safari to allow audio -->
  <button id="playBtn" type="button" aria-label="Play sound">
    <span>DABEH POGI</span>
  </button>
  
  <audio id="audio" src="37263.mp3" preload="auto" loop playsinline></audio>

  <script>
    (() => {
      'use strict';

      const audio = document.getElementById('audio');
      const btn = document.getElementById('playBtn');

      // 1. Force iOS to treat this as media playback (bypasses physical mute switch)
      if ('audioSession' in navigator) {
        try { navigator.audioSession.type = 'playback'; } catch(_){}
      }
      
      const BOOST = 3.0;
      let ctx = null;
      let graphReady = false;
      let isPlaying = false; // Anti-spam flag

      audio.volume = 1;

      // 2. Web Audio API for Volume Boost
      function buildGraph() {
        if (graphReady) return;
        graphReady = true;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try {
          ctx = new AC();
          const src = ctx.createMediaElementSource(audio);
          const gain = ctx.createGain();
          gain.gain.value = BOOST;

          const comp = ctx.createDynamicsCompressor();
          comp.threshold.value = -14;
          comp.knee.value = 8;
          comp.ratio.value = 20;
          comp.attack.value = 0.002;
          comp.release.value = 0.2;

          src.connect(gain).connect(comp).connect(ctx.destination);
        } catch (err) {
          console.warn('Web Audio error:', err);
          ctx = null;
        }
      }

      // 3. Play Logic
      function playSound() {
        // Anti-spam: If it's already playing, do nothing
        if (isPlaying || !audio.paused) return;

        // iOS requires ctx.resume() to be called synchronously inside the click
        if (ctx && ctx.state !== 'running') {
          ctx.resume().catch(() => {});
        }

        isPlaying = true;
        audio.play().catch(err => {
          console.warn('Playback blocked:', err);
          isPlaying = false; // Reset if it fails so they can try again
        });
      }

      // 4. Media Session API (Play only)
      if ('mediaSession' in navigator) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'DABEH POGI', artist: 'DABEH POGI', album: 'DABEH POGI'
          });
          navigator.mediaSession.setActionHandler('play', playSound);
          navigator.mediaSession.setActionHandler('pause', null); 
          navigator.mediaSession.setActionHandler('stop', null);
        } catch(_){}
      }

      // 5. Bind the event directly to the button (NOT the document)
      btn.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        playSound();
      });
      
      // Fallback for iOS if pointerdown doesn't trigger
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        playSound();
      });

      // 6. Boot up
      buildGraph();
      try { audio.load(); } catch(_){}
      
      // Try to autoplay immediately (browsers will block until tap)
      playSound();

      // 7. Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(console.error);
        });
      }
    })();
  </script>
</body>
</html>
