<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TapSound</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{
      --bg:#0a0a0f;
      --fg:#f6f6fa;
      --muted:#8b8b9c;
      --orange:#ff7a1a;
      --orange-deep:#e85d00;
      --orange-hot:#ff9440;
      --size:min(56vw,210px);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      display:grid;
      place-items:center;
      overflow:hidden;
      color:var(--fg);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      -webkit-user-select:none;
      background:
        radial-gradient(1200px 620px at 50% -12%, #2a1a10 0%, transparent 62%),
        radial-gradient(900px 520px at 50% 112%, #241206 0%, transparent 62%),
        var(--bg);
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .app{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      padding:24px;
    }

    /* ---------- button + pulse rings ---------- */
    .stage{
      position:relative;
      width:var(--size);
      height:var(--size);
      display:grid;
      place-items:center;
      margin-bottom:30px;
    }
    .halo{
      position:absolute;
      inset:0;
      border-radius:50%;
      border:2px solid rgba(255,122,26,.55);
      opacity:0;
      pointer-events:none;
    }
    body.playing .halo{animation:pulse 2.6s cubic-bezier(.2,.6,.4,1) infinite}
    body.playing .halo:nth-child(2){animation-delay:1.3s}
    @keyframes pulse{
      0%{transform:scale(1);opacity:.65}
      70%{opacity:0}
      100%{transform:scale(1.75);opacity:0}
    }

    .tapbtn{
      position:relative;
      z-index:2;
      width:100%;
      height:100%;
      border:0;
      border-radius:50%;
      display:grid;
      place-items:center;
      padding:10%;
      cursor:pointer;
      color:#1a0d00;
      font-family:inherit;
      font-weight:900;
      font-size:clamp(15px,4.6vw,24px);
      letter-spacing:.08em;
      line-height:1.15;
      text-transform:uppercase;
      text-align:center;
      touch-action:manipulation;
      background:radial-gradient(circle at 32% 26%, var(--orange-hot), var(--orange) 52%, var(--orange-deep) 100%);
      box-shadow:
        0 20px 45px rgba(0,0,0,.65),
        0 0 0 1px rgba(255,255,255,.10) inset,
        0 18px 60px rgba(255,122,26,.28);
      transition:transform .06s ease, box-shadow .2s ease, filter .2s ease;
      will-change:transform;
    }
    .tapbtn:active{transform:scale(.94)}
    .tapbtn:focus-visible{outline:3px solid #fff;outline-offset:8px}

    body.playing .tapbtn{
      filter:brightness(1.06);
      box-shadow:
        0 22px 60px rgba(255,122,26,.55),
        0 0 0 1px rgba(255,255,255,.16) inset,
        0 0 80px rgba(255,122,26,.45);
    }

    /* ---------- text ---------- */
    .title{
      margin:0;
      font-size:22px;
      font-weight:700;
      letter-spacing:-.02em;
    }
    .status{
      margin:7px 0 0;
      font-size:14px;
      color:var(--muted);
      transition:color .3s ease;
    }
    body.playing .status{color:var(--orange-hot)}

    /* ---------- equalizer bars ---------- */
    .bars{
      display:flex;
      align-items:center;
      gap:4px;
      height:26px;
      margin-top:22px;
      opacity:.3;
      transition:opacity .3s ease;
    }
    body.playing .bars{opacity:1}
    .bars i{
      width:4px;
      height:6px;
      border-radius:2px;
      background:linear-gradient(180deg,var(--orange-hot),var(--orange-deep));
      transition:height .25s ease;
    }
    body.playing .bars i{animation:eq 1s ease-in-out infinite}
    .bars i:nth-child(1){animation-delay:-.90s}
    .bars i:nth-child(2){animation-delay:-.60s}
    .bars i:nth-child(3){animation-delay:-.35s}
    .bars i:nth-child(4){animation-delay:-.75s}
    .bars i:nth-child(5){animation-delay:-.15s}
    .bars i:nth-child(6){animation-delay:-.50s}
    .bars i:nth-child(7){animation-delay:-.80s}
    @keyframes eq{0%,100%{height:6px}50%{height:24px}}

    .hint{
      position:fixed;
      left:0;right:0;
      bottom:calc(18px + env(safe-area-inset-bottom));
      text-align:center;
      font-size:12px;
      letter-spacing:.02em;
      color:#5d5d70;
      pointer-events:none;
    }

    @media (prefers-reduced-motion:reduce){
      .halo,.bars i{animation:none !important}
      .tapbtn{transition:none}
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="stage">
      <span class="halo"></span>
      <span class="halo"></span>
      <button id="btn" class="tapbtn" type="button" aria-label="Play sound">DABEH POGI</button>
    </div>

    <h1 class="title">TapSound</h1>
    <p class="status" id="status">Tap to play</p>

    <div class="bars" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
  </main>

  <p class="hint">Loops continuously · Works offline</p>

  <audio id="audio" src="37263.mp3" preload="auto" loop playsinline></audio>

  <script>
  (() => {
    'use strict';

    const audio    = document.getElementById('audio');
    const btn      = document.getElementById('btn');
    const statusEl = document.getElementById('status');

    /* ---- tweakables ---- */
    const BOOST        = 3.0;  // louder output, compressor keeps peaks in check
    const START_OFFSET = 0;    // seconds to skip if the file begins with silence

    let ctx = null, graphReady = false;
    let lastBtnStart = 0;

    audio.volume = 1;

    /* ---------- loudness boost (Web Audio) ---------- */
    function buildGraph(){
      if (graphReady) return;
      graphReady = true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try{
        ctx = new AC();
        const src  = ctx.createMediaElementSource(audio);
        const gain = ctx.createGain();
        gain.gain.value = BOOST;

        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value      = 8;
        comp.ratio.value     = 20;
        comp.attack.value    = 0.002;
        comp.release.value   = 0.2;

        src.connect(gain).connect(comp).connect(ctx.destination);
      }catch(err){
        console.warn('Web Audio unavailable, using element volume only', err);
        ctx = null;
      }
    }

    function resumeCtx(){
      if (ctx && ctx.state !== 'running') return ctx.resume().catch(() => {});
      return Promise.resolve();
    }

    /* ---------- play-only playback ---------- */
    async function start(restart){
      resumeCtx();

      if (restart && !audio.paused) {
        try { audio.currentTime = 0; } catch(_){}
      }

      try{
        await audio.play();
      }catch(err){
        console.warn('Playback blocked:', err && err.name);
      }
      syncUI();
    }

    function syncUI(){
      const playing = !audio.paused;
      document.body.classList.toggle('playing', playing);
      btn.setAttribute('aria-label', playing ? 'Playing sound' : 'Play sound');
      statusEl.textContent = audio.error
        ? 'Audio unavailable'
        : (playing ? 'Playing · looping' : 'Tap to play');
    }

    /* ---------- media session (play only) ---------- */
    function setupMediaSession(){
      if (!('mediaSession' in navigator)) return;
      try{
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'TapSound', artist: 'TapSound', album: 'TapSound'
        });
        navigator.mediaSession.setActionHandler('play', () => start(false));
      }catch(_){}
    }

    /* ---------- immediate input handlers ---------- */
    function startFromButton(){
      lastBtnStart = performance.now();
      start(true);
    }

    function onDocPointerDown(e){
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target instanceof Element && e.target.closest('#btn')) return;
      start(false);
    }

    function onBtnPointerDown(e){
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      startFromButton();
    }

    function onDocKeyDown(e){
      if (e.target instanceof Element && e.target.closest('#btn')) return;
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        start(false);
      }
    }

    function onBtnKeyDown(e){
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        startFromButton();
      }
    }

    /* fallback for screen readers / synthetic clicks only */
    function onBtnClick(e){
      if (e.detail === 0 && performance.now() - lastBtnStart > 300) {
        startFromButton();
      }
    }

    document.addEventListener('pointerdown', onDocPointerDown, { capture: true, passive: true });
    document.addEventListener('keydown', onDocKeyDown, true);
    btn.addEventListener('pointerdown', onBtnPointerDown, { passive: true });
    btn.addEventListener('keydown', onBtnKeyDown);
    btn.addEventListener('click', onBtnClick);

    /* ---------- element events ---------- */
    ['play','pause','ended','loadedmetadata','error'].forEach(ev =>
      audio.addEventListener(ev, syncUI)
    );

    /* ---------- boot ---------- */
    buildGraph();
    try { audio.load(); } catch(_){}
    setupMediaSession();
    syncUI();
    start(false); // autoplay attempt; browsers usually require first gesture

    /* ---------- service worker ---------- */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  })();
  </script>
</body>
</html>
