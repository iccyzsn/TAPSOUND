<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FF5C00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DABEH POGI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FF5C00;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .text {
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(2rem, 12vw, 8rem);
      font-weight: 800;
      font-style: italic;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none; /* Clicks pass through to the body */
    }
  </style>
</head>
<body>
  <div class="text">DABEH POGI</div>
  <audio id="audio" src="37263.mp3" preload="auto" loop playsinline></audio>

  <script>
    (() => {
      'use strict';

      const audio = document.getElementById('audio');
      
      // Loudness boost settings
      const BOOST = 3.0;
      
      let ctx = null;
      let graphReady = false;

      audio.volume = 1;

      // 1. Web Audio API for Volume Boost
      function buildGraph() {
        if (graphReady) return;
        graphReady = true;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try {
          ctx = new AC();
          const src = ctx.createMediaElementSource(audio);
          const gain = ctx.createGain();
          gain.gain.value = BOOST;

          const comp = ctx.createDynamicsCompressor();
          comp.threshold.value = -14;
          comp.knee.value = 8;
          comp.ratio.value = 20;
          comp.attack.value = 0.002;
          comp.release.value = 0.2;

          src.connect(gain).connect(comp).connect(ctx.destination);
        } catch (err) {
          ctx = null;
        }
      }

      // 2. Play logic with Anti-Spam check
      function playSound() {
        // If audio is already playing, do nothing (prevents spamming/restarting)
        if (!audio.paused) return;

        // Unlock audio context for mobile
        if (ctx && ctx.state !== 'running') {
          ctx.resume().catch(() => {});
        }
        
        audio.play().catch(err => {
          console.warn('Playback blocked:', err);
        });
      }

      // 3. Media Session (Play only, no pause)
      if ('mediaSession' in navigator) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'DABEH POGI', artist: 'DABEH POGI', album: 'DABEH POGI'
          });
          navigator.mediaSession.setActionHandler('play', playSound);
          navigator.mediaSession.setActionHandler('pause', null); // Disable pause
          navigator.mediaSession.setActionHandler('stop', null);  // Disable stop
        } catch(_){}
      }

      // 4. Listen for any tap or keypress
      function handleInteraction(e) {
        if (e.type === 'pointerdown' && e.button !== undefined && e.button !== 0) return;
        if (e.type === 'keydown' && e.key !== ' ' && e.key !== 'Enter') return;
        playSound();
      }

      document.addEventListener('pointerdown', handleInteraction, { passive: true });
      document.addEventListener('keydown', handleInteraction, { passive: true });

      // 5. Boot up
      buildGraph();
      try { audio.load(); } catch(_){}
      
      // Try to autoplay immediately (browsers will block until user taps)
      playSound();

      // 6. Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(console.error);
        });
      }
    })();
  </script>
</body>
</html>
