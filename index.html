  <script>
    (() => {
      'use strict';

      const audio = document.getElementById('audio');
      const btn = document.getElementById('playBtn');

      /*
       * Detect iOS / iPadOS.
       */
      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (
          navigator.platform === 'MacIntel' &&
          navigator.maxTouchPoints > 1
        );

      /*
       * iOS Web Audio state.
       */
      let audioContext = null;
      let graphReady = false;

      /*
       * Normal HTML audio volume.
       */
      audio.volume = 1;


      /*
       * =========================================================
       * ANDROID / NON-iOS
       * =========================================================
       *
       * Uses normal HTML5 audio playback.
       */
      function playDefault() {
        if (!audio.paused) {
          return;
        }

        audio.play().catch((error) => {
          console.warn('Playback blocked:', error);
        });
      }


      /*
       * =========================================================
       * iOS WEB AUDIO
       * =========================================================
       *
       * IMPORTANT:
       * The AudioContext is NOT created during page load.
       *
       * It is created only after the user taps the button.
       */
      function buildIOSGraph() {

        if (graphReady) {
          return;
        }

        const AudioContextClass =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AudioContextClass) {
          console.warn('Web Audio API is unavailable on this device.');
          return;
        }

        try {

          audioContext = new AudioContextClass();

          const source =
            audioContext.createMediaElementSource(audio);

          const gain =
            audioContext.createGain();

          const compressor =
            audioContext.createDynamicsCompressor();


          /*
           * Volume boost.
           */
          gain.gain.value = 3.0;


          /*
           * Compression prevents the boosted signal
           * from becoming excessively distorted.
           */
          compressor.threshold.value = -14;
          compressor.knee.value = 8;
          compressor.ratio.value = 20;
          compressor.attack.value = 0.002;
          compressor.release.value = 0.2;


          /*
           * Audio chain:
           *
           * MP3
           *   ↓
           * Gain
           *   ↓
           * Compressor
           *   ↓
           * iPhone speakers
           */
          source
            .connect(gain)
            .connect(compressor)
            .connect(audioContext.destination);


          graphReady = true;

        } catch (error) {

          console.warn(
            'iOS Web Audio setup failed:',
            error
          );

          audioContext = null;
        }
      }


      /*
       * =========================================================
       * iOS PLAYBACK
       * =========================================================
       */
      async function playIOS() {

        if (!audio.paused) {
          return;
        }


        /*
         * Build the audio graph as part of the
         * user's tap gesture.
         */
        buildIOSGraph();


        /*
         * Resume the AudioContext after the user gesture.
         */
        if (
          audioContext &&
          audioContext.state !== 'running'
        ) {
          try {
            await audioContext.resume();
          } catch (error) {
            console.warn(
              'AudioContext resume failed:',
              error
            );
          }
        }


        /*
         * Start the actual media element.
         */
        try {

          await audio.play();

        } catch (error) {

          console.warn(
            'iOS audio playback failed:',
            error
          );
        }
      }


      /*
       * =========================================================
       * PLATFORM PLAYBACK
       * =========================================================
       */
      function playSound() {

        if (isIOS) {
          playIOS();
        } else {
          playDefault();
        }
      }


      /*
       * =========================================================
       * BUTTON EVENTS
       * =========================================================
       *
       * pointerdown gives iOS the user gesture as early as
       * possible.
       */
      btn.addEventListener('pointerdown', (event) => {

        /*
         * Ignore secondary mouse buttons.
         */
        if (
          event.button !== undefined &&
          event.button !== 0
        ) {
          return;
        }

        playSound();
      });


      /*
       * Fallback for browsers where pointer events behave
       * differently.
       */
      btn.addEventListener('click', (event) => {

        event.preventDefault();

        playSound();
      });


      /*
       * =========================================================
       * MEDIA SESSION
       * =========================================================
       */
      if ('mediaSession' in navigator) {

        try {

          navigator.mediaSession.metadata =
            new MediaMetadata({
              title: 'DABEH POGI',
              artist: 'DABEH POGI',
              album: 'DABEH POGI'
            });


          navigator.mediaSession.setActionHandler(
            'play',
            playSound
          );

        } catch (_) {}
      }


      /*
       * =========================================================
       * INITIAL LOAD
       * =========================================================
       *
       * We intentionally DO NOT call playSound() here.
       *
       * iOS requires user interaction before audio playback.
       */
      try {
        audio.load();
      } catch (_) {}


      /*
       * =========================================================
       * SERVICE WORKER
       * =========================================================
       */
      if ('serviceWorker' in navigator) {

        window.addEventListener('load', () => {

          navigator.serviceWorker
            .register('sw.js')
            .catch((error) => {
              console.error(
                'Service worker registration failed:',
                error
              );
            });

        });
      }

    })();
  </script></body>
